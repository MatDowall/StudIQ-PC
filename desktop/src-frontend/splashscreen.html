<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudIQ</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #1E1E1E;
        overflow: hidden;
      }
      .splash {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        font-family: "Segoe UI", -apple-system, sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }
      .splash img {
        width: 96px;
        height: 96px;
        object-fit: contain;
      }
      .splash p {
        margin-top: 16px;
        color: #888888;
        font-size: 13px;
        letter-spacing: 0.04em;
      }
      .splash .version {
        margin-top: 4px;
        color: #555555;
        font-size: 11px;
        letter-spacing: 0.04em;
      }
    </style>
  </head>
  <body>
    <div class="splash">
      <img src="/studiq-logo.png" alt="StudIQ" />
      <p>Loading...</p>
      <div class="version" id="version"></div>
    </div>
    <script type="module">
      import { getVersion } from "@tauri-apps/api/app";
      getVersion().then((v) => {
        document.getElementById("version").textContent = "v" + v;
      });
    </script>
  </body>
</html>
